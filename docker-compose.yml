services:
  # Single-node replica set, not a standalone mongod.
  #
  # Transactions require a replica set, and checkout/payment settlement now rely
  # on them. Production runs on MongoDB Atlas (always a replica set, even on the
  # free M0 tier), so running one node in `rs0` locally keeps development on the
  # same semantics instead of only discovering the difference in production.
  mongo:
    image: mongo:7
    container_name: lylaglass-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot and reports healthy once a
      # primary has been elected. `rs.initiate` is idempotent-by-guard: on later
      # boots `rs.status()` already succeeds and the initiate is skipped.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}).ok
          }
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: lylaglass-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # `directConnection=true` is required when reaching a single-node replica
      # set by its container name: without it the driver follows the replica set
      # host list, which advertises `mongo:27017` from inside the cluster.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/lylaglass?replicaSet=rs0&directConnection=true}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
      MONGODB_REQUIRE_TRANSACTIONS: ${MONGODB_REQUIRE_TRANSACTIONS:-true}
      # Storefront and admin are two separate apps/origins — see README §
      # "Xác thực admin" for why the admin app's session cookie depends on
      # this split.
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      # Every browser origin allowed to call this API with credentials
      # (cookies) — must list both apps' real origins in production.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Separate from JWT_SECRET on purpose — see backend/src/utils/csrf.ts.
      CSRF_SECRET: ${CSRF_SECRET}
      # Leave empty (host-only cookie) unless the API is deliberately meant to
      # share the session cookie beyond the admin app.
      ADMIN_COOKIE_DOMAIN: ${ADMIN_COOKIE_DOMAIN:-}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@lylaglass.vn}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Payments: VietQR transfer to the shop's TPBank account
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-vietqr}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-970423}
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-TPB}
      VIETQR_BANK_NAME: ${VIETQR_BANK_NAME:-TPBank}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME}
      PAYMENT_TTL_MINUTES: ${PAYMENT_TTL_MINUTES:-15}
      PAYMENT_EXPIRY_SWEEP_INTERVAL_MS: ${PAYMENT_EXPIRY_SWEEP_INTERVAL_MS:-60000}
      # Incoming-transfer notifications (SePay -> POST /api/payments/bank-webhook)
      BANK_WEBHOOK_PROVIDER: ${BANK_WEBHOOK_PROVIDER:-sepay}
      BANK_WEBHOOK_AUTH_MODE: ${BANK_WEBHOOK_AUTH_MODE:-hmac}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET}
      BANK_WEBHOOK_API_KEY: ${BANK_WEBHOOK_API_KEY}
      BANK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${BANK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      # Transactional email — Gmail API (OAuth2 refresh token)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_SENDER: ${GMAIL_SENDER}
      EMAIL_FROM: ${EMAIL_FROM:-LylaGlass <no-reply@lylaglass.vn>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      ORDER_NOTIFICATION_EMAILS: ${ORDER_NOTIFICATION_EMAILS}

volumes:
  mongo-data:
