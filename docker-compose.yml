services:
  mongo:
    image: mongo:7
    container_name: lylaglass-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: lylaglass-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/lylaglass
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@lylaglass.vn}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Payments: VietQR transfer to the shop's TPBank account
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-vietqr}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-970423}
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-TPB}
      VIETQR_BANK_NAME: ${VIETQR_BANK_NAME:-TPBank}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME}
      PAYMENT_TTL_MINUTES: ${PAYMENT_TTL_MINUTES:-15}
      PAYMENT_EXPIRY_SWEEP_INTERVAL_MS: ${PAYMENT_EXPIRY_SWEEP_INTERVAL_MS:-60000}
      # Incoming-transfer notifications (SePay -> POST /api/payments/bank-webhook)
      BANK_WEBHOOK_PROVIDER: ${BANK_WEBHOOK_PROVIDER:-sepay}
      BANK_WEBHOOK_AUTH_MODE: ${BANK_WEBHOOK_AUTH_MODE:-hmac}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET}
      BANK_WEBHOOK_API_KEY: ${BANK_WEBHOOK_API_KEY}
      BANK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${BANK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      # Transactional email
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-LylaGlass <no-reply@lylaglass.vn>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      ORDER_NOTIFICATION_EMAILS: ${ORDER_NOTIFICATION_EMAILS}

volumes:
  mongo-data:
